# 코드를 올릴 때마다 GitHub가 앱을 대신 빌드해 봐요.
# - 항상: 테스트용 APK(폰에 바로 설치)와 서명 안 된 AAB를 만들어요.
# - 서명 키를 Secrets에 넣어 두면: 플레이 스토어에 바로 올릴 수 있는 서명된 AAB도 만들어요.
#   (Settings → Secrets and variables → Actions 에 아래 4개)
#   UPLOAD_KEYSTORE_BASE64 : .jks 파일을 base64로 바꾼 글자
#   UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD
name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build debug APK and release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Sign release AAB (키가 있을 때만)
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > upload.jks
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore upload.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          rm upload.jks

      - uses: actions/upload-artifact@v4
        with:
          name: roomscale-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: roomscale-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
