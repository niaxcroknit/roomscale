<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:var(--safe-area-inset-top, env(safe-area-inset-top,0px));padding-bottom:var(--safe-area-inset-bottom, env(safe-area-inset-bottom,0px))}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent}</style>
</head><body>
<title>룸 스케일</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: drafting table — big measured drawing on the left, spec sheet panel on the right; stacks on phones. Soft pencil greys only. */
:root{
  --paper:#f0f1f2; --sheet:#fbfbfc; --ink:#3b4349; --ink-2:#7a848a; --rule:#dde0e3;
  --line:#a7afb4; --wall:#8d969c; --grid:#ebedef; --grid-major:#dadee1;
  --shade:#eef0f1; --shade-2:#e3e6e8; --shade-3:#d5d9dc; --behind:#c6ccd0; --pick:#9da6ac; --frame:#e8eaec; --hover:#f5f6f7;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  --paper:#16191c; --sheet:#1c2024; --ink:#d3d8dc; --ink-2:#8c959b; --rule:#2c3237;
  --line:#5b646a; --wall:#7a848a; --grid:#22272b; --grid-major:#2c3237;
  --shade:#252a2f; --shade-2:#2e3439; --shade-3:#3a4147; --behind:#474f56; --pick:#6c767d; --frame:#2a2f34; --hover:#22272b; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:16px 32px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-weight:400;margin-left:8px}
.tabs{display:flex;gap:4px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:3px}
.tabs button{border:0;background:none;color:var(--ink-2);font:500 13px var(--sans);padding:6px 12px;border-radius:6px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--shade-2);color:var(--ink)}
.tabs button:disabled{opacity:.4;cursor:default}
/* 배치안 바 */
.plans{display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:2px;min-width:0}
.plans .lbl{font-size:12px;color:var(--ink-2);white-space:nowrap;margin-right:2px}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);font:500 13px var(--sans);padding:5px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.chip:hover{color:var(--ink);border-color:var(--line)}
.chip[aria-current="true"]{background:var(--shade-2);color:var(--ink);border-color:var(--line)}
.chip.add{border-style:dashed}
.chip:disabled{opacity:.4;cursor:default}
.chip:disabled:hover{color:var(--ink-2);border-color:var(--rule)}
.sync{margin-left:auto;flex:none;font-size:12px;color:var(--ink-2);white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}.sync{margin-left:6px}}
@media (max-width:600px){.sync{display:none}.hint{font-size:12px}.stage{padding:10px}}
.stage{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stage-head{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.stage-head b{font-weight:600}
.hist{margin-left:auto;display:flex;gap:6px;flex:none}
.hbtn{min-width:44px;height:36px;padding:0 12px;border:1px solid var(--line);background:var(--shade);color:var(--ink);font:500 15px var(--sans);border-radius:8px;cursor:pointer}
.hbtn span{font-size:13px}
.hbtn:hover{border-color:var(--line);background:var(--hover)}
.hbtn:disabled{opacity:.55;cursor:default;background:var(--sheet)}
@media (max-width:520px){.hbtn span{display:none}.hbtn{font-size:18px}.hbtn.zl{font-size:12px}.stage-head .scale{order:3;width:100%}.stage-head b{width:100%}.zoom{margin-left:0}.hist{margin-left:auto}}
.scale{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
#cv{width:100%;height:auto;max-height:78vh;min-height:220px;display:block;margin:0 auto;touch-action:pan-x pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
.cvwrap{overflow:auto;max-height:78vh;-webkit-overflow-scrolling:touch;border-radius:6px}
#cv.zoomed{max-height:none}
.furn,.box,.sbox,.door,.win,.divg{touch-action:none}
.zoom{display:flex;gap:4px;flex:none;margin-left:auto}
.zoom + .hist{margin-left:0}
.hbtn.sm{min-width:36px;padding:0 8px}
.hbtn.zl{font:500 12px var(--mono);min-width:52px}
.hbtn[aria-pressed="true"]{background:var(--shade-3)}
.tip{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px}
.hint{font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px;background:var(--paper);border-radius:8px;padding:10px 12px}
.furn text.halo{paint-order:stroke;stroke:var(--sheet)}
.clr line,.clr path{stroke:var(--ink-2);stroke-dasharray:3 2;fill:none;pointer-events:none}
.clr text{font-family:var(--mono);font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--sheet);pointer-events:none}
.cellname{fill:var(--ink-2);font-family:var(--sans);font-weight:500;pointer-events:none}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmpcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.cmpcol select{font:500 14px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;width:100%}
.cmpcol svg{width:100%;height:auto;display:block}
.cmpinfo{font-size:12.5px;color:var(--ink-2)}
.stage.cmp .zoom,.stage.cmp .hist #undo,.stage.cmp .hist #redo{display:none}
.cmptbl td:not(:first-child),.cmptbl th:not(:first-child){text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
@media (max-width:700px){.compare{grid-template-columns:1fr}}
.hint .bad{color:var(--ink);font-weight:500}
.hint .bad::before{content:'⚠ '}
aside{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0}
.card.focus{border-color:var(--line)}
.grid2,.grid3,.grid4{display:grid;gap:8px}
.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);min-width:0}
input{font:15px var(--mono);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
input[type=text]{font-family:var(--sans)}
input:focus-visible,button:focus-visible{outline:2px solid var(--line);outline-offset:1px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{font:500 13px var(--sans);border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:6px;padding:7px 11px;cursor:pointer}
.btn:hover{border-color:var(--line);background:var(--hover)}
.btn.primary{background:var(--shade-2);border-color:var(--line)}
.btn.primary:hover{background:var(--shade-3)}
.btn.danger{color:var(--ink-2)}
.btn.armed{background:var(--shade-3);color:var(--ink);border-color:var(--wall)}
.list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.list button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:0;background:none;color:var(--ink);font:14px var(--sans);padding:6px 6px;border-radius:6px;cursor:pointer}
.list button:hover{background:var(--hover)}
.list button[aria-current="true"]{background:var(--shade-2)}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.dim{font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;padding:0 7px;border-radius:99px;border:1px dashed var(--wall);color:var(--ink);white-space:nowrap}
.boxrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer}
.boxrow:hover{background:var(--hover)}
.boxrow.on{background:var(--shade-2)}
.x{border:0;background:none;color:var(--ink-2);font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
.x:hover{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:4px 2px;border-bottom:1px solid var(--rule);text-align:left}
th{font-weight:500;color:var(--ink-2);font-size:11.5px}
td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.big{font-weight:600;color:var(--ink)}
.howfit{font-size:12px;color:var(--ink-2)}
.note{font-size:12px;color:var(--ink-2);margin:0}
.empty{font-size:13px;color:var(--ink-2);margin:0}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);font:500 12.5px var(--sans);padding:6px 0;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--shade-2);color:var(--ink);border-color:var(--line)}
/* svg */
.floor{fill:url(#grid)}
.wall{fill:none;stroke:var(--wall);pointer-events:none}
.olabel{font-family:var(--sans);font-weight:500;fill:var(--ink-2);paint-order:stroke;stroke:var(--sheet);pointer-events:none}
.dimtxt{font-family:var(--mono);fill:var(--ink-2)}
.dimln{stroke:var(--line);fill:none}
.furn .body{fill:var(--shade);stroke:var(--line);cursor:grab;stroke-linejoin:round}
.furn .front{stroke:var(--line);fill:none;pointer-events:none}
.furn text{fill:var(--ink);pointer-events:none;font-family:var(--sans)}
.furn.bad .body{stroke-dasharray:4 3}
.furn.sel .body{fill:var(--shade-3)}
.gap{fill:var(--sheet);stroke:none}
.door .leaf,.door .arc,.door .jamb,.win .pane{stroke:var(--line);fill:none}
.door .swing{fill:var(--shade);fill-opacity:.5;stroke:none}
.door .hitpad,.win .hitpad{fill:transparent;stroke:none;cursor:grab}
.door.sel .leaf,.door.sel .arc,.win.sel .pane{stroke:var(--wall);stroke-dasharray:3 2}
.door.bad .swing{fill:var(--shade-3)}
.frame{fill:var(--frame);stroke:var(--wall)}
.back{fill:url(#grid)}
.shelf{fill:var(--frame);stroke:var(--line)}
.box rect{fill:var(--shade-2);stroke:var(--line);cursor:grab}
.box text{fill:var(--ink);pointer-events:none;font-family:var(--sans)}
.box.sel rect{fill:var(--shade-3)}
.box.bad rect{stroke-dasharray:3 2}
.sbox rect{fill:var(--shade-2);fill-opacity:.8;stroke:var(--line);cursor:grab}
.sbox.far rect{fill:var(--behind);fill-opacity:1;stroke-dasharray:5 3}
.sbox.sel rect{fill:var(--pick);fill-opacity:1;stroke:var(--ink);stroke-dasharray:none}
#cv .sbox.sel rect{stroke-width:2px}
.sbox.sel text{fill:var(--ink);font-weight:600}
.sbox.bad rect{stroke-dasharray:3 2}
.sbox text{fill:var(--ink);font-family:var(--sans);pointer-events:none}
.sbox.far text{fill:var(--ink-2)}
.vlabel{fill:var(--ink);font-family:var(--sans);font-weight:600}
.ghost{fill:var(--shade-3);fill-opacity:.4;stroke:var(--line);stroke-dasharray:4 3;pointer-events:none}
.cell{fill:transparent;cursor:pointer;stroke:none}
.cell:hover{fill:var(--shade);fill-opacity:.7}
.cell.on{fill:var(--shade-2);fill-opacity:.7;stroke:var(--line);stroke-dasharray:3 2}
.cellno{fill:var(--ink);font-family:var(--sans);font-weight:600;pointer-events:none}
.celldim{fill:var(--ink-2);font-family:var(--mono);pointer-events:none}
.divg .hitpad{fill:transparent;stroke:none}
.divg.h{cursor:ns-resize}.divg.v{cursor:ew-resize}
.divg:hover .shelf,.divg.on .shelf{fill:var(--shade-3)}
.splits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split,.shape{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);font:500 13px var(--sans);cursor:pointer}
.split:hover,.shape:hover{border-color:var(--line);background:var(--hover)}
.shape[aria-pressed="true"]{border-color:var(--line);background:var(--shade-2)}
.split svg,.shape svg{width:40px;height:40px}
.split svg rect,.shape svg path{fill:var(--shade);stroke:var(--line);stroke-width:2}
.split svg line{stroke:var(--wall);stroke-width:4}
.split small{font-weight:400;color:var(--ink-2);font-size:11.5px}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.shape{padding:8px 4px;font-size:12px;gap:4px}
.cellhead{display:flex;align-items:center;gap:8px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--shade-2);color:var(--ink);font:600 12px var(--mono)}
.plans .grp{font-size:11.5px;color:var(--ink-2);white-space:nowrap;padding-left:8px;margin-left:2px;border-left:1px solid var(--rule)}
.plans .grp:first-of-type{border-left:0;padding-left:0}
.mgr-back{position:fixed;inset:0;background:rgb(0 0 0 / .2);display:flex;justify-content:center;align-items:flex-start;padding:calc(24px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) 16px 24px;z-index:20}
.mgr{background:var(--sheet);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;max-height:calc(100% - 8px);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgb(0 0 0 / .12);overflow:hidden}
.mgr-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mgr-head h2{margin:0;font-size:17px;font-weight:600}
.mgr .sorts{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--paper);border-radius:10px;padding:4px}
.mgr .sorts button{border:0;background:none;color:var(--ink-2);font:500 13.5px var(--sans);padding:9px 4px;border-radius:7px;cursor:pointer}
.mgr .sorts button:hover{background:var(--sheet);color:var(--ink)}
.mrows{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;overflow-y:auto;min-height:0;flex:1 1 auto}
.mrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px;align-items:center;padding:4px 6px 4px 2px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.mrow.cur{border-color:var(--line)}
.mrow.on{background:var(--shade-2);border-color:var(--wall)}
.mrow.dragging{opacity:.6;border-style:dashed}
.handle{cursor:grab;color:var(--ink-2);font-size:18px;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;line-height:44px}
.mpick{display:grid;grid-template-columns:24px minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;border:0;background:none;color:var(--ink);padding:8px 2px;min-height:52px;cursor:pointer;font-family:var(--sans)}
.tick{grid-row:1 / 3;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink);background:var(--sheet)}
.mrow.on .tick{background:var(--wall);border-color:var(--wall);color:var(--sheet)}
.mname{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msub{font-size:12px;color:var(--ink-2);font-family:var(--mono);display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.gtag{font-family:var(--sans);font-size:11.5px;padding:0 7px;border-radius:99px;background:var(--shade-2);color:var(--ink)}
.mv{display:flex;gap:4px}
.mv button{border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);width:40px;height:40px;border-radius:8px;cursor:pointer;font-size:16px}
.mv button:hover{color:var(--ink);border-color:var(--line)}
.mv button:disabled{opacity:.3;cursor:default}
.mgr-foot{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--rule)}
.selbar{display:flex;align-items:center;gap:14px;font-size:14px}
.selbar b{margin-right:auto;font-weight:600}
.link{border:0;background:none;color:var(--ink-2);font:500 13px var(--sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0}
.gpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl2{width:100%;font-size:12px;color:var(--ink-2)}
.gchip{border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:500 14px var(--sans);padding:8px 14px;border-radius:99px;cursor:pointer;min-height:40px}
.gchip:hover{background:var(--shade)}
.gchip.add{border-style:dashed}
.gchip.off{color:var(--ink-2)}
.newg{display:flex;gap:6px;flex:1 1 220px;min-width:0}
.newg input{flex:1;min-width:0;font:15px var(--sans);border-radius:99px;padding:8px 14px}
.btn.wide{width:100%;padding:11px;font-size:14px}
.btn:disabled{opacity:.6;cursor:default}
@media (max-width:600px){
  .mgr-back{align-items:flex-end;padding:0}
  .mgr{max-width:none;border-radius:16px 16px 0 0;border-bottom:0;max-height:92%;padding:16px 16px calc(16px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)))}
}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));transform:translateX(-50%);background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;box-shadow:0 4px 16px rgb(0 0 0 / .08)}
/* 선 두께: 방 벽·가구 바깥 틀만 굵게, 나머지는 그 절반으로 통일 */
#cv :not(pattern) > :is(rect,path,line,polygon,polyline){vector-effect:non-scaling-stroke;stroke-width:1.5px}
#cv .wall,#cv .frame{stroke-width:3px}
#cv text{stroke-width:0}
#cv text.halo{stroke-width:5px;vector-effect:non-scaling-stroke}
.gmin{stroke:var(--grid)}.gmaj{stroke:var(--grid-major)}
@media (prefers-reduced-motion:no-preference){.btn,.list button,.chip{transition:background .12s,border-color .12s}}
</style>

<div class="wrap">
  <header>
    <h1>룸 스케일<small>단위 cm</small></h1>
    <nav class="tabs" aria-label="보기 전환">
      <button id="tab-room" type="button" data-act="view-room">방 배치</button>
      <button id="tab-inner" type="button" data-act="view-inner">가구 속 정리</button>
    </nav>
  </header>
  <div class="plans" id="plans" aria-label="배치안"></div>
  <div class="layout">
    <section class="stage">
      <div class="stage-head"><b id="stage-title"></b><span class="scale" id="scale"></span>
        <span class="zoom" id="zoombar"><button class="hbtn sm" data-act="zoom-out" aria-label="작게 보기">−</button><button class="hbtn sm zl" id="zoomlbl" data-act="zoom-fit" title="화면에 맞추기">100%</button><button class="hbtn sm" data-act="zoom-in" aria-label="크게 보기">+</button></span>
        <span class="hist"><button class="hbtn" id="helpbtn" data-act="help" aria-pressed="false" aria-label="도움말">?</button><button class="hbtn" id="undo" data-act="undo" title="되돌리기 (Ctrl/⌘+Z)" aria-label="되돌리기">↶<span> 되돌리기</span></button><button class="hbtn" id="redo" data-act="redo" title="다시 (Ctrl/⌘+Shift+Z)" aria-label="다시">↷<span> 다시</span></button></span></div>
      <div class="cvwrap" id="cvwrap"><svg id="cv" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="compare" id="compare" hidden></div>
      <div class="tip" id="tip"></div>
      <div class="hint" id="hint" hidden></div>
    </section>
    <aside id="panel"></aside>
  </div>

function renderCalc(){
  const f = getF(sel), el = document.getElementById('calc'); if (!f || !el) return;

  if (!(bw > 0 && bh > 0 && bd > 0)){ el.innerHTML = ''; return }
  const rows = geo(f).cells.map(c => {
    const ch = c.top - c.bottom, cw = c.x1 - c.x0, ly = Math.floor(ch / bh);
    const a = [Math.floor(cw / bw), Math.floor(f.inner.d / bd)], b = [Math.floor(cw / bd), Math.floor(f.inner.d / bw)];
    const best = a[0]*a[1] >= b[0]*b[1] ? a : b, n = best[0] * best[1] * ly;
    return `<tr><td><span class="badge">${c.no}</span> ${c.name ? esc(c.name) + ' ' : ''}<span class="dim">${r1(cw)}×${r1(ch)}</span></td><td class="howfit">${n ? `가로 ${best[0]} · 앞뒤 ${best[1]}줄 · ${ly}층${best === b ? ' (돌려서)' : ''}` : '안 들어가요'}</td><td class="n big">${n}개</td></tr>`;
  }).join('');
  el.innerHTML = `<p class="note">이 크기면 칸마다 최대 몇 개?</p><table><thead><tr><th>칸 (너비×높이)</th><th>넣는 모양</th><th style="text-align:right">개수</th></tr></thead><tbody>${rows}</tbody></table>

}

function setGroup(g){

function mgrAct(act, t){
  const idx = id => STORE.plans.findIndex(q => q.id === id);
  if (act !== 'mgr-del') mgr.armed = false;
  switch (act){
    case 'mgr-open': mgr.open = true; mgr.picked.clear(); break;
    case 'mgr-close': mgr.open = false; break;
    case 'mgr-pick': { const id = t.dataset.id; mgr.picked.has(id) ? mgr.picked.delete(id) : mgr.picked.add(id); break; }
    case 'mgr-all': if (mgr.picked.size === STORE.plans.length) mgr.picked.clear(); else STORE.plans.forEach(q => mgr.picked.add(q.id)); break;
    case 'mgr-none': mgr.picked.clear(); break;
    case 'mgr-up': case 'mgr-down': { const i = idx(t.dataset.id), j = act === 'mgr-up' ? i - 1 : i + 1; if (j < 0 || j >= STORE.plans.length) break;
      [STORE.plans[i], STORE.plans[j]] = [STORE.plans[j], STORE.plans[i]]; plansChanged(); break; }
    case 'mgr-sort': { const k = t.dataset.k, cmp = (a, b) => a.name.localeCompare(b.name, 'ko', {numeric:true});
      if (k === 'name') STORE.plans.sort(cmp);
      else if (k === 'recent') STORE.plans.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      else { const first = []; for (const q of STORE.plans){ const g = q.group || ''; if (!first.includes(g)) first.push(g) }
        STORE.plans.sort((a, b) => (!a.group) - (!b.group) || first.indexOf(a.group || '') - first.indexOf(b.group || '') || cmp(a, b)) }
      plansChanged(); toast(k === 'name' ? '가나다순으로 정렬했어요' : k === 'recent' ? '최근 고친 순으로 정렬했어요' : '그룹끼리 모았어요'); break; }
    case 'mgr-group': setGroup(t.dataset.g || ''); break;
    case 'mgr-group-new': { const g = (document.getElementById('mgr-gname')?.value || '').trim(); if (!g){ document.getElementById('mgr-gname')?.focus(); return } setGroup(g); break; }
    case 'mgr-del': { const n = mgr.picked.size; if (!n || n >= STORE.plans.length) break;
      if (!mgr.armed){ mgr.armed = true; break }
      const gone = STORE.plans.filter(q => mgr.picked.has(q.id));
      STORE.plans = STORE.plans.filter(q => !mgr.picked.has(q.id)); gone.forEach(q => { cloudDelete(q); delete hist[q.id] });
      mgr.picked.clear(); mgr.armed = false; plansChanged(); persistHist();
      if (!STORE.plans.some(q => q.id === S.id)) switchPlan(STORE.plans[0].id);
      toast(`배치안 ${n}개를 지웠어요`); break; }
  }
  renderMgr();
}

function syncText(long){
  if (APP) return long ? '배치안은 이 폰에 자동으로 저장돼요. 앱을 지우거나 폰을 바꾸면 사라지니, 가끔 "백업 파일 저장"으로 따로 보관해 두세요.' : '이 폰에 저장됨';

  if (cloud.state === 'saving') return long ? '백업하는 중이에요.' : '☁ 백업 중…';
  if (cloud.state === 'error') return long ? '계정 백업이 잠시 안 되고 있어요. 이 브라우저에는 저장돼 있어요. 백업 파일도 저장해 두세요.' : '이 브라우저에만 저장됨';
  return long ? '지금은 이 브라우저에만 저장돼요. 백업 파일로 저장해 두면 다른 곳에서도 불러올 수 있어요.' : '이 브라우저에 저장됨';

function setSync(st){ cloud.state = st; if (st === 'ok') cloud.at = Date.now(); const a = document.getElementById('sync'); if (a) a.textContent = syncText(); const b = document.getElementById('sync-note'); if (b) b.textContent = syncText(true) }
const planDoc = q => ({name:q.name, group:q.group || '', order:STORE.plans.indexOf(q), updatedAt:q.updatedAt, json:JSON.stringify({room:q.room, furniture:q.furniture, example:q.example})});
function cloudQueue(q){
  if (!cloud.col) return;
  clearTimeout(cloud.timers[q.id]); setSync('saving');
  cloud.timers[q.id] = setTimeout(async () => { try{ await cloud.col.doc(q.id).set(planDoc(q)); setSync('ok') }catch(e){ setSync('error') } }, 1200);
}
async function cloudDelete(q){ if (!cloud.col) return; try{ await cloud.col.doc(q.id).set({deleted:true, updatedAt:Date.now()}); setSync('ok') }catch(e){ setSync('error') } }
async function initCloud(){
  if (!window.claude || !claude.use) return;
  try{
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const me = await user.id(); if (!me) return;
    cloud.col = db.collection('data/users/' + me);
    const snap = await cloud.col.get();
    const seen = new Set(); let changed = false;
    for (const d of snap.docs){
      const v = d.data(); if (!v) continue; seen.add(d.id);
      const local = STORE.plans.find(q => q.id === d.id);
      if (v.deleted){ if (local && local.updatedAt <= v.updatedAt){ STORE.plans = STORE.plans.filter(q => q !== local); changed = true } continue }
      if (!local || v.updatedAt > local.updatedAt){
        let body; try{ body = migrate(JSON.parse(v.json)) }catch(e){ continue }
        const q = {id:d.id, name:v.name, group:v.group || '', order:v.order, updatedAt:v.updatedAt, ...body};
        if (local) Object.assign(local, q); else STORE.plans.push(q); changed = true;
      }
    }
    for (const q of STORE.plans) if (!seen.has(q.id) || snap.docs.find(d => d.id === q.id)?.data()?.updatedAt < q.updatedAt) await cloud.col.doc(q.id).set(planDoc(q));
    if (changed) STORE.plans.sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
    if (!STORE.plans.length){ const q = makePlan('A안', sample()); STORE.plans.push(q) }
    setSync('ok');
    if (changed){ for (const k in hist) delete hist[k]; persistLocal(); switchPlan(STORE.plans.some(q => q.id === STORE.current) ? STORE.current : STORE.plans[0].id) }
  }catch(e){ setSync('error') }
}

async function exportBackup(){
  const data = JSON.stringify({app:'룸 스케일', version:2, exportedAt:new Date().toISOString(), plans:STORE.plans}, null, 1);
  const d = new Date(), name = `룸스케일_백업_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  if (APP){ // 앱: 파일을 만든 뒤 공유 창으로 드라이브·카톡·내 파일 등에 보관
    try{
      const P = Capacitor.Plugins, fname = name.replace(/[^\w.가-힣-]/g, '_');
      await P.Filesystem.writeFile({path:fname, data, directory:'CACHE', encoding:'utf8'});
      const {uri} = await P.Filesystem.getUri({path:fname, directory:'CACHE'});
      await P.Share.share({title:'배치도 백업 파일', text:'룸 스케일 백업', files:[uri], dialogTitle:'백업 파일 보관할 곳 고르기'});
    }catch(e){ if (!/cancel/i.test(String(e && (e.message || e)))) toast('백업 파일을 만들지 못했어요. 다시 눌러 주세요') }
    return;
  }
  let dl = null; try{ dl = window.claude && claude.use ? await claude.use('downloads') : null }catch(e){}
  if (dl){ try{ await dl.save({filename:name, data}); toast('백업 파일을 저장했어요') }catch(e){ if (e && e.code !== 'declined' && e.code !== 'cancelled') toast('저장하지 못했어요. 다시 눌러 주세요') } return }
  try{ await navigator.clipboard.writeText(data); toast('파일 저장이 안 되는 화면이라, 백업 내용을 복사했어요. 메모장에 붙여넣어 .json으로 저장하세요') }
  catch(e){ toast('이 화면에서는 백업 파일을 저장할 수 없어요') }
}

document.addEventListener('click', e => {

    case 'merge': { const p = selCell.slice(0, -1), n = node(f, p), nm = (n.a && !n.a.split && n.a.name) || (n.b && !n.b.split && n.b.name) || ''; if (nm) n.name = nm; delete n.split; delete n.at; delete n.a; delete n.b; selCell = p; settleAll(f); break; }
    case 'add-b': {
      const w = val('nb-w'), h = val('nb-h'), d = val('nb-d'), q = clamp(Math.round(val('nb-q')) || 1, 1, 40);
      if (!(w > 0 && h > 0 && d > 0)) break;

    case 'zoom-in': zoom = Math.min(4, +(zoom * 1.5).toFixed(2)); renderStage(); return;
    case 'zoom-out': zoom = Math.max(1, +(zoom / 1.5).toFixed(2)); if (zoom < 1.05) zoom = 1; renderStage(); return;
    case 'zoom-fit': zoom = 1; renderStage(); return;
    case 'compare': if (STORE.plans.length < 2){ toast('배치안이 2개 이상 있어야 비교할 수 있어요. "+ 복사해서 새로"로 하나 더 만들어 보세요'); return }
      view = 'compare'; cmpIds = [S.id, (STORE.plans.find(q => q.id !== S.id)).id]; renderAll(); return;
    case 'mgr-open': case 'mgr-close': case 'mgr-pick': case 'mgr-all': case 'mgr-none': case 'mgr-group-new': case 'mgr-up': case 'mgr-down': case 'mgr-sort': case 'mgr-group': case 'mgr-del': mgrAct(act, t); return;
    case 'undo': undo(); return;
    case 'redo': redo(); return;
    case 'plan-dup': { const q = clone(S); q.id = uid(); q.name = nextName(); q.updatedAt = Date.now(); q.example = false; STORE.plans.push(q); STORE.current = q.id; S = q; toast(`"${q.name}"을 만들었어요. 이제 마음껏 바꿔 보세요`); break; }
    case 'plan-empty': { const q = makePlan(nextName(), {room:clone(S.room), furniture:[]}); STORE.plans.push(q); STORE.current = q.id; S = q; sel = null; break; }
    case 'plan-sample': { const q = makePlan('예시', sample()); STORE.plans.push(q); STORE.current = q.id; S = q; sel = S.furniture[2].id; break; }
    case 'plan-del': if (prevArmed === 'plan-del'){ const gone = S; STORE.plans = STORE.plans.filter(q => q !== gone); cloudDelete(gone); switchPlan(STORE.plans[0].id); return } else armed = 'plan-del'; break;
    case 'export': exportBackup(); return;
    case 'import': document.getElementById('importFile').click(); return;
    case 'add-door': case 'add-win': { const o = {id:uid(), name:act === 'add-door' ? '문 ' + (S.room.openings.filter(x => x.type === 'door').length + 1) : '창문 ' + (S.room.openings.filter(x => x.type !== 'door').length + 1), type:act === 'add-door' ? 'door' : 'window', wall:'bottom', w:act === 'add-door' ? 80 : 120, hinge:'start'};
      o.pos = Math.max(0, r1((S.room.w - o.w) / 2)); S.room.openings.push(o); selOpen = o.id; break; }
    case 'pick-o': selOpen = t.dataset.id; break;
    case 'o-wall': { const o = S.room.openings.find(o => o.id === selOpen); o.wall = t.dataset.w; break; }
    case 'o-hinge': { const o = S.room.openings.find(o => o.id === selOpen); o.hinge = o.hinge === 'end' ? 'start' : 'end'; break; }
    case 'o-del': S.room.openings = S.room.openings.filter(o => o.id !== selOpen); selOpen = null; break;
    default: return;
  }
  if (!['view-room','view-inner','pick','pick-b','nshape','pick-o'].includes(act) && !armed) S.example = false;
  save(); renderAll();
});

// ---------- 끌기 ----------
function pt(e){ const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()) }
function snapTo(v, cs, d, lo, hi){ let best = v, bd = d; for (const c of cs){ const k = Math.abs(v - c); if (k < bd && c >= lo - 0.01 && c <= hi + 0.01){ bd = k; best = c } } return r1(best) }
svg.addEventListener('pointerdown', e => {
  const g = e.target.closest('[data-oid],[data-fid],[data-bid],[data-sbid],[data-div]'); if (!g) return; // 빈 곳·칸은 눌러도 스크롤되게 (칸 고르기는 click에서)
  const p = pt(e); e.preventDefault();
  if (g.dataset.oid){ selOpen = g.dataset.oid; drag = {op:S.room.openings.find(o => o.id === selOpen)}; svg.setPointerCapture(e.pointerId); renderAll(); return }
  if (g.dataset.sbid){ const f = getF(sel), b = f.boxes.find(b => b.id === g.dataset.sbid); selBox = b.id; drag = {sbox:b, o:b, f, dz:p.x - (sideX + (b.z || 0)), dy:(f.inner.h - p.y) - b.y}; svg.setPointerCapture(e.pointerId); renderAll(); return }
  if (g.dataset.div !== undefined){ const f = getF(sel), d = geo(f).divs.find(d => d.path === g.dataset.div); drag = {div:d.path, dir:d.dir, r:d.r, f} }
  else if (view === 'room'){ const f = getF(g.dataset.fid); sel = f.id; selOpen = null; drag = {o:f, dx:p.x - f.x, dy:p.y - f.y} }
  else { const f = getF(sel), b = f.boxes.find(b => b.id === g.dataset.bid); selBox = b.id; drag = {o:b, f, dx:p.x - b.x, dy:(f.inner.h - p.y) - b.y} }
  svg.setPointerCapture(e.pointerId); renderAll();
});
svg.addEventListener('pointermove', e => {
  if (!drag) return; const p = pt(e);
  if (drag.sbox){ // 옆모습: 앞뒤로 밀어넣기, 앞·뒤 벽과 다른 박스 앞뒤면에 착
    const b = drag.sbox, f = drag.f, mz = Math.max(0, r1(f.inner.d - b.d));
    let z = clamp(Math.round(p.x - sideX - drag.dz), 0, mz);
    const cz = [0, mz];
    for (const o of f.boxes) if (o !== b && xOver(b, o.x, o.x + o.w) && b.y < o.y + o.h && o.y < b.y + b.h) cz.push(r1((o.z || 0) + o.d), r1((o.z || 0) - b.d));
    b.z = snapTo(z, cz, Math.max(SNAP_BOX, f.inner.d / 12), 0, mz);
    // 위아래도: 바닥·선반·다른 박스 위아래 면에 착
    const my = Math.max(0, f.inner.h - b.h), G = geo(f), cy = [0, my];
    let y = clamp(Math.round((f.inner.h - p.y) - drag.dy), 0, my);
    for (const c of G.cells) if (xOver(b, c.x0, c.x1)) cy.push(c.bottom, r1(c.top - b.h));
    for (const o of f.boxes) if (o !== b && xOver(b, o.x, o.x + o.w) && zOver(b, o)) cy.push(r1(o.y + o.h), r1(o.y - b.h));
    b.y = snapTo(y, cy, Math.max(SNAP_BOX, f.inner.w / 12), 0, my);
    renderStage(); return;
  }
  if (drag.op){ // 문·창문: 가장 가까운 벽을 따라 미끄러짐, 모서리에 착
    const R = S.room, o = drag.op, dist = {top:Math.abs(p.y), bottom:Math.abs(R.d - p.y), left:Math.abs(p.x), right:Math.abs(R.w - p.x)};
    o.wall = Object.keys(dist).sort((a, b) => dist[a] - dist[b])[0];
    const len = wallGeom(R, o.wall).len, along = o.wall === 'top' || o.wall === 'bottom' ? p.x : p.y, mx = Math.max(0, len - o.w);
    o.pos = snapTo(clamp(Math.round(along - o.w / 2), 0, mx), [0, mx], SNAP_ROOM, 0, mx);
    renderStage(); return;
  }
  if (drag.div !== undefined){ // 선반·칸막이 끌기: 다른 판과 높이/위치가 맞으면 착
    const f = drag.f, n = node(f, drag.div), r = drag.r, G = geo(f), snapD = Math.max(SNAP_BOX, Math.max(f.inner.w, f.inner.h) / 30);
    const others = G.divs.filter(d => d.dir === drag.dir && d.path !== drag.div).map(d => drag.dir === 'h' ? d.y0 : d.x0);
    if (drag.dir === 'h'){ const lo = r.y0 + 1, hi = r.y1 - T - 1; let y = clamp(Math.round(f.inner.h - p.y - T / 2), lo, hi); y = snapTo(y, others, snapD, lo, hi); n.at = r1(y - r.y0) }
    else { const lo = r.x0 + 1, hi = r.x1 - T - 1; let x = clamp(Math.round(p.x - T / 2), lo, hi); x = snapTo(x, others, snapD, lo, hi); n.at = r1(x - r.x0) }
    renderStage(); return;
  }
  if (view === 'room'){ const f = drag.o, s = fp(f), mx = Math.max(0, S.room.w - s.w), my = Math.max(0, S.room.d - s.d);
    f.x = clamp(Math.round(p.x - drag.dx), 0, mx); f.y = clamp(Math.round(p.y - drag.dy), 0, my);
    // 자석: 벽과 다른 가구 모서리 중 가장 가까운 곳에 착. 더 밀면 겹칠 수 있음
    const cx = [0, mx], cy = [0, my], own = localPieces(f).map(P => bbox(toRel(f, P)));
    for (const o of S.furniture){ if (o === f) continue;
      for (const q of pieces(o).map(bbox)) for (const r of own){
        if (f.y + r.y0 < q.y1 && q.y0 < f.y + r.y1) cx.push(q.x0 - r.x1, q.x1 - r.x0, q.x0 - r.x0, q.x1 - r.x1);
        if (f.x + r.x0 < q.x1 && q.x0 < f.x + r.x1) cy.push(q.y0 - r.y1, q.y1 - r.y0, q.y0 - r.y0, q.y1 - r.y1) } }
    f.x = snapTo(f.x, cx, SNAP_ROOM, 0, mx); f.y = snapTo(f.y, cy, SNAP_ROOM, 0, my); }
  else { const b = drag.o, f = drag.f, I = f.inner, mx = Math.max(0, I.w - b.w), my = Math.max(0, I.h - b.h), G = geo(f);
    b.x = clamp(r1(Math.round(p.x - drag.dx)), 0, mx); b.y = clamp(Math.round((I.h - p.y) - drag.dy), 0, my);
    // 자석: 칸 벽, 다른 수납함, 바닥·선반·상자 윗면에 착. 더 밀면 겹칠 수 있음
    const cx = [], cy = [];
    for (const c of G.cells){ cx.push(c.x0, r1(c.x1 - b.w)); if (xOver(b, c.x0, c.x1)) cy.push(c.bottom, r1(c.top - b.h)) }
    for (const o of f.boxes){ if (o === b || !zOver(b, o)) continue;
      if (b.y < o.y + o.h && o.y < b.y + b.h) cx.push(o.x - b.w, o.x + o.w, o.x, o.x + o.w - b.w);
      if (xOver(b, o.x, o.x + o.w)){ cy.push(o.y + o.h, o.y - b.h); cx.push(o.x, o.x + o.w - b.w, o.x + (o.w - b.w) / 2) } }
    const snapD = Math.max(SNAP_BOX, I.w / 12);
    b.x = snapTo(b.x, cx, snapD, 0, mx); b.y = snapTo(b.y, cy, snapD, 0, my); }
  renderStage();
});
const endDrag = () => { if (!drag) return;
  if (drag.sbox) settle(drag.f, drag.sbox);
  if (drag.op || drag.sbox){ drag = null; S.example = false; save(); renderAll(); return }
  if (drag.div !== undefined) settleAll(drag.f); else if (view === 'inner') settle(drag.f, drag.o);
  drag = null; S.example = false; save(); renderAll() };
svg.addEventListener('click', e => {
  if (e.target.closest('[data-oid],[data-fid],[data-bid],[data-sbid],[data-div]')) return;
  const c = e.target.closest('[data-cell]');
  if (c){ selCell = c.dataset.cell; selBox = null; renderAll(); return }
  if (view === 'room' && selOpen){ selOpen = null; renderAll() }
});
svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('dblclick', e => { const g = e.target.closest('[data-fid]'); if (g){ sel = g.dataset.fid; view = 'inner'; selBox = null; selCell = null; renderAll() } });

document.addEventListener('change', e => { const i = e.target.dataset && e.target.dataset.cmp; if (i !== undefined){ cmpIds[+i] = e.target.value; renderStage(); renderPanel() } });
let rzT = 0; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(renderStage, 150) });
if (APP){
  Capacitor.Plugins.App.addListener('backButton', () => {
    if (mgr.open){ mgr.open = false; renderMgr(); return }
    if (view !== 'room'){ view = 'room'; selBox = null; zoom = 1; renderAll(); return }
    if (selOpen){ selOpen = null; renderAll(); return }
    Capacitor.Plugins.App.minimizeApp ? Capacitor.Plugins.App.minimizeApp() : Capacitor.Plugins.App.exitApp();
  });
}
renderAll();
if (!APP) initCloud();
</script>
